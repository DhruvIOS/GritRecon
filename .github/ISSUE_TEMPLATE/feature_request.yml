name: ✨ Feature Request
description: Suggest an idea or metric improvement for GritRecon
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature or metric would you like to see added?
      placeholder: E.g., Add course syllabus link or historical GPA trend graph.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this feature needed?
      description: Explain how this helps students during course registration.
